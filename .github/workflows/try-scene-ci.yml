name: Nablon try-scene tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check bot.js
          node --check index.js
          node --check try_scene.js
          node --check try_scene_telegram.js
          node --check health.js
      - name: Run product feature tests
        run: npm test
